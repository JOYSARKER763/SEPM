<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Student List</title></head>
<body>
    <h2>Add New Student</h2>
    <form th:action="@{/users}" method="post">
        <input type="text" name="studentName" placeholder="Name" required />
        <input type="text" name="studentId" placeholder="ID" required />
        <input type="number" step="0.01" name="cgpa" placeholder="CGPA" required />
        <button type="submit">Add Student</button>
    </form>
    <h2>Records</h2>
    <table border="1">
        <thead>
            <tr><th>Student Name</th><th>Student ID</th><th>CGPA</th></tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.studentName}"></td>
                <td th:text="${user.studentId}"></td>
                <td th:text="${user.cgpa}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
